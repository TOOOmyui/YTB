name: Quai de diffusion

on:
  push:
    branches: [quai]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quai
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quai
      - name: Recoller et publier les vidéos en attente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LIVRES="$RUNNER_TEMP/livres"; mkdir -p "$LIVRES"
          for d in envoi/*/; do
            [ -d "$d" ] || continue
            nom=$(basename "$d")
            fichier=$(cat "$d/nom.txt")
            cat "$d"/part_* > "$LIVRES/$fichier"
            if [ -f "$d/sha256.txt" ]; then echo "$(cat $d/sha256.txt)  $LIVRES/$fichier" | sha256sum -c -; fi
            gh release delete "$nom" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$nom" "$LIVRES/$fichier" --target quai --title "$nom" --notes "Quai de diffusion de la régie (supprimé après import)."
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$nom/$fichier" > "envoi/$nom.url"
            git rm -rq "$d"
          done
          for f in nettoyage/*.txt; do
            [ -f "$f" ] || continue
            gh release delete "$(basename "$f" .txt)" --yes --cleanup-tag 2>/dev/null || true
            git rm -q "$f"
          done
      - name: Enregistrer
        run: |
          git config user.name "Quai"
          git config user.email "quai@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "quai : publication"
          ok=0; for i in 1 2 3; do git pull --rebase origin quai && git push origin quai && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "Échec de l'enregistrement sur la branche quai"; exit 1; }
